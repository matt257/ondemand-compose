# Cluster Information
ClusterName=ondemand-cluster
ControlMachine=slurm-controller
ControlAddr=slurm-controller

# Authentication
AuthType=auth/munge
CryptoType=crypto/munge

# Logging
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log

# State and PID files
StateSaveLocation=/var/spool/slurm/ctld
SlurmdSpoolDir=/var/spool/slurm/slurmd
SlurmctldPidFile=/var/run/slurmctld.pid
SlurmdPidFile=/var/run/slurmd.pid

# Communication Ports
SlurmdPort=6818
SlurmctldPort=6817

# Scheduler and Plugin Configuration
SchedulerType=sched/backfill
SelectType=select/cons_res
SelectTypeParameters=CR_Core

# Node Configuration
NodeName=slurm-controller CPUs=2 State=UNKNOWN

# Partition Configuration
PartitionName=debug Nodes=slurm-controller Default=YES MaxTime=INFINITE State=UP
